<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>File Upload Test</title>
  <link rel="icon" href="data:;base64,iVBORw0KGgo=">
</head>
<body>
  <h1>Upload a File to S3</h1>
  
  <form id="uploadForm" enctype="multipart/form-data">
    <input type="file" name="file" required />
    <button type="submit">Upload</button>
  </form>

  <div id="result"></div>

  <script>
    const form = document.getElementById('uploadForm');
    const resultDiv = document.getElementById('result');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData(form);
      

      try {
        const response = await fetch('http://localhost:3000/upload/media', { // change port/path as needed
          method: 'POST',
          body: formData
        });

        const data = await response.json();
        resultDiv.innerHTML = `<p>File uploaded successfully!</p>
                               <p>URL: <a href="${data.url}" target="_blank">${data.url}</a></p>`;
      } catch (err) {
        console.error(err);
        resultDiv.textContent = 'Upload failed. See console for details';
      }
    });
  </script>
</body>
</html>
